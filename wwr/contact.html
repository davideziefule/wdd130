<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="You can submit to ask questions about the company and its services on this contact page.">
    <meta name="author" content="David Chibueze Eziefule">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Rafting Company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a>
                </li>
                <li><a href="about.html">About Us</a>
                </li>
                <li><a href="trips.html">Trips</a>
                </li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1>
        <section id="contact-info">
            <p>123 Main River Street<br>Kolob, California <br>
                <a href="tel:+19999999999">+1 999 999 9999</a> <br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </p>
        </section>
        <section id="contact-form-map">
            <div class="map-container"><iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5625037.229052218!2d-118.78355308617789!3d37.0725223633353!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornia%2C%20USA!5e0!3m2!1sen!2sng!4v1790708652189!5m2!1sen!2sng"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input class="form-input" type="text" id="name" name="name"
                          placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="email" id="email" name="email"
                          placeholder="email@gmail.com">
                    </div>
                    <div class="purpose-group">
                        <div>Message <br> Purpose</div>
                        <div class="radio-group">
                            <div class="radio-group-item">
                                <label for="gi">
                                    <input type="radio" name="radio-group" id="gi">General Inquiry
                                </label>
                            </div>
                            <div class="radio-group-item">
                                <label for="rq">
                                    <input type="radio" name="radio-group" id="rq">Reservation
                                    Question
                                </label>
                            </div>
                            <div class="radio-group-item">
                                <label for="ws">
                                    <input type="radio" name="radio-group" id="ws">Website
                                    Suggestion
                                </label>
                            </div>
                        </div>
                    </div>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                    <label class="checkbox-label" for="subsribe">
                        <input type="checkbox" name="subsribe" id="subsribe">
                        Please Subsribe me to the monthly newsletter
                    </label>
                    <button type="submit">Get inTouch!</button>
                </form>
            </div>
        </section>
        <section id="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/rafting47_600.jpg" alt="heavy rowing water">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/rafting53_600.jpg" alt="rowing the boat">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/rafting59_600.jpg" alt="celebration picture">
                <figcaption>Employee Profile</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 WhiteWater Rafting | David Chibueze Eziefule</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook_725289.png" alt="Facebook Logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram_725278.png" alt="LinkedIn Logo">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin_3536505.png" alt="Instagram Logo">
            </a>
        </nav>
    </footer>
</body>

</html>
